<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RBI-ObliBench: finding where RBI rules differ between institution types, measured on an expert-checked benchmark." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f766e'/><path d='M8 22 L14 10 L18 18 L24 8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <title>RBI-ObliBench</title>
    <script>
      try {
        const t = localStorage.getItem("cc-theme");
        const host = document.documentElement.getAttribute("data-theme");
        const sys = host ? host === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = t === "dark" || ((!t || t === "system") && sys);
        document.documentElement.classList.toggle("dark", dark);
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
